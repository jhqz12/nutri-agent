<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>正在进入衡动</title>
    <style>
      :root { font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; color: #17342d; background: #eef6f2; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(86vw, 360px); padding: 24px; border: 1px solid #d7e5df; border-radius: 12px; background: #fff; text-align: center; }
      strong { display: block; margin-bottom: 8px; font-size: 18px; }
      p { margin: 0; color: #5d716b; font-size: 13px; line-height: 1.7; }
    </style>
  </head>
  <body>
    <main>
      <strong>正在进入衡动</strong>
      <p id="status">正在清理旧版本缓存并完成登录，请稍候。</p>
    </main>
    <script>
      (async function () {
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations()
            await Promise.all(registrations.map((registration) => registration.unregister()))
          }
          if ('caches' in window) {
            const cacheNames = await caches.keys()
            await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)))
          }
        } catch (error) {
          document.getElementById('status').textContent = '缓存清理未完全完成，正在继续登录。'
        } finally {
          const destination = new URL('./', window.location.href)
          const currentQuery = new URLSearchParams(window.location.search)
          currentQuery.forEach((value, key) => destination.searchParams.append(key, value))
          destination.searchParams.set('auth_callback', '1')
          destination.hash = window.location.hash
          window.location.replace(destination.toString())
        }
      })()
    </script>
  </body>
</html>
