getArea:"胸廓呼吸与胸肌放松（热身）",sets:1,minReps:6,maxReps:8,targetRir:5,restSeconds:45,steps:"俯卧让泡沫轴轻压胸肌外侧，缓慢吸气把胸廓撑开，再小幅滚动；压力只到舒服，不压锁骨、腋窝或神经敏感处。",commonErrors:"憋气硬压、直接滚骨头、为了更深而把肩膀顶向前。",alternative:"门框胸肌动态伸展，或仰卧屈膝呼吸。"}),qe({id:"push-warm-serratus-wall",name:"前锯肌墙推泡沫轴",targetArea:"前锯肌与肩胛上旋（热身）",sets:2,minReps:8,maxReps:10,targetRir:4,restSeconds:45,steps:"小臂轻压泡沫轴，先把肩胛贴住胸廓，再在不耸肩的范围内向上滑；肋骨保持收住。",commonErrors:"耸肩、顶腰、手臂滑得过高后肩胛失控。",alternative:"墙面肩胛俯卧撑或墙面滑臂。"}),qe({id:"push-warm-abdominal-stretch",name:"站姿腹肌动态伸展",targetArea:"胸廓活动（备用热身）",sets:1,minReps:6,maxReps:8,targetRir:5,restSeconds:45,enabled:!1,steps:"双手扶髋，先收臀和收肋，再做很小幅度的胸椎后伸；不要把动作集中压到腰椎。",commonErrors:"大幅后仰、顶腰、憋气，或把腰椎挤压感当成拉伸。",alternative:"侧卧开书或泡沫轴胸椎伸展。",stopCriteria:"右下背不适上升、腰椎挤压痛或后仰弹响伴疼痛时停止。"}),qe({id:"push-warm-band-circle",name:"弹力带绕肩",targetArea:"肩关节活动与肩胛控制（热身）",sets:2,minReps:12,maxReps:15,targetRir:4,restSeconds:45,steps:"弹力带保持轻张力，只在无痛范围内绕肩；收住肋骨，肩膀不耸起。",commonErrors:"握距太窄、强行跨过卡点、顶腰或追求大幅度。",alternative:"毛巾辅助绕肩或墙面滑臂。"}),qe({id:"push-incline-machine-fly",name:"上斜固定器械夹胸",targetArea:"上胸",sets:2,minReps:10,maxReps:12,targetRir:4,restSeconds:90,steps:"座椅调到把手与上胸齐平，肩胛贴稳靠背；只用无痛范围夹合，顶端短暂停顿。",commonErrors:"肩膀前顶、耸肩、下放过深或用手臂猛夹。",alternative:"低重量绳索夹胸或高位俯卧撑。"}),qe({id:"push-incline-dumbbell-press",name:"上斜哑铃卧推",targetArea:"上胸（症状消失后再启用）",sets:2,minReps:8,maxReps:10,targetRir:4,restSeconds:150,enabled:!1,steps:"凳角20～30度，全握或自然半对握，手腕笔直、肘与躯干约30～45度；腰部保留自然小空隙，不大幅反弓。",commonErrors:"手腕内扣、肘接近90度外开、锁定时耸肩、憋气并用右下背顶起。",alternative:"高位俯卧撑、上斜器械推胸或5～7.5公斤哑铃重建。",stopCriteria:"左手无名指或小拇指麻木、左斜方代偿、右下背牵拉扩散或手腕失控时立即停止。"}),qe({id:"push-incline-machine-press",name:"上斜器械推胸",targetArea:"上胸（备用）",sets:2,minReps:10,maxReps:12,targetRir:4,restSeconds:120,enabled:!1,steps:"优先选择20～30度靠背，前臂与推力方向一致；肘不过度抬高，推到不耸肩的位置就停止。",commonErrors:"把肘抬到接近肩高、腰部反弓、锁肘耸肩或使用半握导致手腕失控。",alternative:"坐姿器械平推或高位俯卧撑。"}),qe({id:"push-seated-machine-press",name:"坐姿器械平推",targetArea:"中胸",sets:3,minReps:8,maxReps:12,targetRir:3,restSeconds:120,steps:"全握把手，脚踩稳，肩胛贴住靠背；推起时缓慢呼气，顶部不耸肩、不强锁肘。",commonErrors:"
